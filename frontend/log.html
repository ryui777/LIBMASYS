<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Log in to PTCHub, your digital library account.">
  <title>PTCHub | Log In</title>
  <link rel="stylesheet" href="style/lms_style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
<div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>

<div class="container page-fade">
  <header>
    <a class="logo" href="homepage.html">
      <div class="logo-img"><img src="images/ptclogo.jpg" alt="PTC Logo"></div>
      <div><div class="title">PTCHub</div><div class="subtitle">Your Digital Library</div></div>
    </a>
    <nav><a href="homepage.html" class="nav-home">Home</a></nav>
  </header>

  <main class="logcontainer">
    <div class="auth-card">
      <span class="tag">Welcome back</span>
      <h1>Log in to PTCHub</h1>
      <p class="lead">Choose your account type, then enter your credentials.</p>

      <form id="loginForm" class="login-form">
        <div class="role-toggle" role="radiogroup" aria-label="Login role">
          <label class="role-option active">
            <input type="radio" name="role" value="user" checked>
            <span>Student</span>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="admin">
            <span>Admin</span>
          </label>
        </div>

        <div class="input-grp">
          <input type="text" name="email" id="loginEmail" placeholder="Email or username" required autocomplete="username">
          <ion-icon name="mail"></ion-icon>
        </div>
        <div class="input-grp">
          <input type="password" name="password" id="loginPass" placeholder="Password" required autocomplete="current-password">
          <ion-icon class="toggle-pass" name="eye-off"></ion-icon>
        </div>
        <div class="rempass-cont">
          <label class="remember-me">
            <input type="checkbox" name="rememberMe"> Remember me
          </label>
          <a href="forgotpass.html" class="forgot-pass">Forgot Password?</a>
        </div>
        <button type="submit" class="cta2">Log In</button>
      </form>

      <div class="auth-link">Student account only? <a href="sin.html">Create one</a></div>

      <div class="demo-note">
        <strong>Admin Demo:</strong><br>
        Username: <code>admin123</code><br>
        Password: <code>admin123</code>
      </div>
    </div>
  </main>

  <footer>
    <div>&copy; <strong>2026 PTCHub</strong> - Digital Library System</div>
    <div>Facebook &nbsp;|&nbsp; Instagram &nbsp;|&nbsp; TikTok</div>
  </footer>
</div>

<script src="js/toast.js"></script>
<script src="js/log-sin.js" defer></script>
</body>
</html>
